name: Tests

on:
  push:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: library-management
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: library-management/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Unit/integration tests use the Flask test client. tests/e2e is run in
      # its own steps below because it needs the app running over HTTP
      # (those steps only run once a test_*.py file exists in tests/e2e).
      - name: Run tests with coverage (fails below 90%)
        run: python -m pytest -v --ignore=tests/e2e --cov=app --cov-report=term-missing --cov-fail-under=90

      - name: Install E2E dependencies and Chromium
        if: hashFiles('library-management/tests/e2e/test_*.py') != ''
        run: |
          python -m pip install -r requirements-e2e.txt
          python -m playwright install --with-deps chromium

      - name: Start the app in the background
        if: hashFiles('library-management/tests/e2e/test_*.py') != ''
        run: |
          nohup flask --app run run --host 0.0.0.0 --port 5000 > flask.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5000/ > /dev/null && exit 0
            sleep 1
          done
          echo "App did not start"; cat flask.log; exit 1

      - name: Run E2E browser tests
        if: hashFiles('library-management/tests/e2e/test_*.py') != ''
        run: python -m pytest tests/e2e -v

      - name: Show app log if anything failed
        if: failure()
        run: cat flask.log || true
